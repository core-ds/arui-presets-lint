name: Tests

on: [pull_request]

# Новый пуш в PR отменяет ещё идущие прогоны предыдущего коммита
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            # Прогоняем на всех поддерживаемых мажорах Node (см. engines в пакетах);
            # не отменяем вторую джобу при падении первой, чтобы видеть,
            # специфична ли поломка для конкретной версии
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn

            - name: Install dependencies
              run: |
                  yarn install --immutable

            - name: Run tests
              run: |
                  yarn test
